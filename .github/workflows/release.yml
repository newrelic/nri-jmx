name: Release pipeline

on:
  release:
    types:
      - released
    tags:
      - 'v*'


permissions:
  contents: read

jobs:
  release:
    if: ${{ !contains(github.event.release.body, 'release-flow=batch') }}
    uses: newrelic/coreint-automation/.github/workflows/reusable_on_release.yaml@v4
    with:
      integration: jmx
      tag: ${{ github.event.release.tag_name }}
      upload_fips_packages: true
      publish_schema: "ohi-jmx" # ohi-jmx for integrations that bundle JMX on windows installers
    secrets: inherit
